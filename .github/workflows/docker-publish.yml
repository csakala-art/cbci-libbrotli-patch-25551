name: Docker

# Adapted from cloudbees-oss/inject-metadata-velero-plugin docker-publish.yml
# Builds amd64 libbrotli-patched OC + MM images and pushes to GHCR.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Fixed customer-facing tag
  IMAGE_TAG: 2.555.1.36488-libbrotli-patch

jobs:
  build:
    name: Docker (${{ matrix.id }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: oc
            context: ./oc
            image: ghcr.io/csakala-art/cbci-libbrotli-patch-25551/cloudbees-cloud-core-oc
            package: cbci-libbrotli-patch-25551/cloudbees-cloud-core-oc
          - id: mm
            context: ./mm
            image: ghcr.io/csakala-art/cbci-libbrotli-patch-25551/cloudbees-core-mm
            package: cbci-libbrotli-patch-25551/cloudbees-core-mm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # User packages often start private; make them anonymously pullable for the customer.
      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PKG")
          echo "Setting visibility public for package: $PKG ($ENC)"
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${ENC}/visibility" \
            -f visibility=public
